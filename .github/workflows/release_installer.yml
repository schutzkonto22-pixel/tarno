name: Release TARNO Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workspace/installer/requirements.txt
          pip install -r workspace/installer/requirements-dev.txt
          pip install pyinstaller

      - name: Remove enum34 (obsolete backport, blocks PyInstaller)
        # A transitive dependency in requirements.txt pulls in enum34, which
        # PyInstaller refuses to run with (it shadows the stdlib enum module
        # on Python 3). workspace/installer/build_installer.py already works
        # around this locally (cleanup_obsolete_packages()) - mirrored here
        # since the CI venv is built fresh from requirements.txt each run.
        run: pip uninstall -y enum34

      - name: Run backend tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s workspace/debug/tests

      - name: Publish WinUI 3 frontend
        run: >
          dotnet publish src/TARNO.UI/TARNO.UI.csproj
          -c Release -r win-x64 --self-contained true -p:Platform=x64

      - name: Build PyInstaller bundle (backend)
        working-directory: workspace/installer
        run: pyinstaller --noconfirm "Tarno Mesh.spec"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows installer
        working-directory: workspace/installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "setup.iss"

      - name: Generate checksums
        working-directory: workspace/installer/Output
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -Append -Encoding utf8 SHA256SUMS.txt
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarno-installer
          path: |
            workspace/installer/Output/*.exe
            workspace/installer/Output/SHA256SUMS.txt

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            workspace/installer/Output/*.exe
            workspace/installer/Output/SHA256SUMS.txt
